<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#f4511e">

    <title>
        भगवा रक्षक हिन्दू सेना | धर्म • सेवा • संस्कार
    </title>

    <meta name="keywords"

    <link

    <link

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           BASIC RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            font-family: "Noto Sans Devanagari", sans-serif;
            background: #fffaf5;
            color: #222;
            overflow-x: hidden;
        }


        img {
            max-width: 100%;
            display: block;
        }


        a {
            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        .container {
            width: min(1150px, 92%);
            margin: auto;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }


        .header-content {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }


        /* LOGO */

        .logo a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #222;
            font-size: 22px;
            font-weight: 800;
        }


        .logo img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            border-radius: 8px;
        }


        /* =========================================
           DESKTOP NAVIGATION
        ========================================= */

        .sidenav > ul {
            display: flex;
            align-items: center;
            gap: 3px;
            list-style: none;
        }


        .sidenav li {
            list-style: none;
            position: relative;
        }


        .sidenav > ul > li > a {
            display: block;
            padding: 11px 12px;
            color: #222;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            transition: 0.25s;
            cursor: pointer;
        }


        .sidenav > ul > li > a:hover {
            color: #f4511e;
            background: #fff2eb;
        }


        /* =========================================
           STORY DROPDOWN - DESKTOP
        ========================================= */

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 5px);
            right: 0;

            width: 220px;

            background: #ffffff;

            padding: 8px;

            border-radius: 12px;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.15);

            display: none;

            z-index: 10020;
        }


        .dropdown:hover .dropdown-menu {
            display: block;
        }


        .dropdown-menu li {
            width: 100%;
        }


        .dropdown-menu li a {
            display: block;

            padding: 12px;

            color: #333;

            font-size: 15px;
            font-weight: 600;

            border-radius: 8px;

            cursor: pointer;
        }


        .dropdown-menu li a:hover {
            color: #f4511e;
            background: #fff3ec;
        }


        /* =========================================
           JOIN BUTTON
        ========================================= */

        .cta-button {
            background: #f4511e !important;
            color: #ffffff !important;
            padding: 11px 18px !important;
            border-radius: 8px !important;
        }


        .cta-button:hover {
            background: #d84315 !important;
        }


        /* Poster button desktop hidden */

        .poster-link-button {
            display: none !important;
        }


        /* =========================================
           HAMBURGER
        ========================================= */

        .hamburger-menu-icon {

            display: none;

            width: 54px;
            height: 54px;

            border: 1px solid #e2e2e2;

            background: #ffffff;

            border-radius: 14px;

            cursor: pointer;

            padding: 10px;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 6px;

            position: relative;

            z-index: 10005;

            -webkit-tap-highlight-color: transparent;
        }


        .hamburger-menu-icon .bar {

            width: 30px;
            height: 4px;

            background: #f4511e;

            border-radius: 5px;

            display: block;

            pointer-events: none;
        }


        /* =========================================
           HERO
        ========================================= */

        .hero-section {

            min-height: 610px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            position: relative;

            background:
                linear-gradient(
                    rgba(20,20,20,0.62),
                    rgba(20,20,20,0.62)
                ),
                radial-gradient(
                    circle at center,
                    #777777,
                    #555555
                );
        }


        .hero-content {

            width: min(900px, 90%);

            color: #ffffff;
        }


        .hero-content h1 {

            font-size:
                clamp(38px, 6vw, 68px);

            line-height: 1.3;

            font-weight: 800;

            margin-bottom: 22px;

            text-shadow:
                0 4px 10px rgba(0,0,0,0.45);
        }


        .hero-content h2 {

            color: #ffd180;

            font-size:
                clamp(23px, 4vw, 38px);

            margin-bottom: 20px;
        }


        .hero-content p {

            font-size:
                clamp(17px, 3vw, 24px);

            line-height: 1.8;

            margin-bottom: 32px;
        }


        .main-cta-button {

            display: inline-block;

            background: #f4511e;

            color: #ffffff;

            padding: 16px 34px;

            border-radius: 14px;

            font-size: 20px;

            font-weight: 700;

            box-shadow:
                0 8px 25px rgba(244,81,30,0.35);

            transition: 0.25s;
        }


        .main-cta-button:hover {

            transform: translateY(-3px);

            background: #e64a19;
        }


        /* =========================================
           ABOUT
        ========================================= */

        .about-us-summary {

            padding: 90px 0;

            background: #ffffff;

            text-align: center;
        }


        .about-us-summary h2 {

            color: #e64a19;

            font-size:
                clamp(34px, 5vw, 50px);

            margin-bottom: 25px;
        }


        .about-us-summary p {

            max-width: 850px;

            margin: auto;

            font-size: 18px;

            line-height: 2;

            color: #666666;
        }


        .read-more-button {

            display: inline-block;

            margin-top: 30px;

            background: #222222;

            color: #ffffff;

            padding: 13px 25px;

            border-radius: 10px;

            font-weight: 700;
        }


        .read-more-button:hover {

            background: #f4511e;
        }


        /* =========================================
           MISSION
        ========================================= */

        .mission-vision {

            padding: 80px 0;

            background: #fff4ec;
        }


        .mission-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 30px;
        }


        .mission-item {

            background: #ffffff;

            padding: 40px 30px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 30px rgba(0,0,0,0.07);
        }


        .mission-item i {

            width: 70px;
            height: 70px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fff0e8;

            color: #f4511e;

            font-size: 30px;
        }


        .mission-item h3 {

            font-size: 26px;

            margin-bottom: 15px;
        }


        .mission-item p {

            color: #666666;

            line-height: 1.9;

            font-size: 16px;
        }


        /* =========================================
           SLOGAN
        ========================================= */

        .slogan-banner {

            padding: 55px 0;

            background: #f4511e;

            color: #ffffff;

            text-align: center;
        }


        .slogan-banner h2 {

            font-size:
                clamp(30px, 5vw, 48px);
        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            background: #171717;

            color: #ffffff;

            padding: 55px 0 25px;
        }


        .footer-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 40px;
        }


        footer h3 {

            color: #ffab70;

            margin-bottom: 18px;
        }


        footer ul {

            list-style: none;
        }


        footer li {

            margin-bottom: 10px;
        }


        footer a {

            color: #dddddd;
        }


        footer a:hover {

            color: #ff8a50;
        }


        .social-icons {

            display: flex;

            gap: 12px;
        }


        .social-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #292929;

            color: #ffffff;

            font-size: 18px;
        }


        .social-icon:hover {

            background: #f4511e;

            color: #ffffff;
        }


        .copyright {

            border-top: 1px solid #333333;

            margin-top: 35px;

            padding-top: 20px;

            text-align: center;

            color: #aaaaaa;

            font-size: 14px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 768px) {


            /* Header */

            .header-content {

                min-height: 70px;

                width: 92%;
            }


            .logo a {

                font-size: 16px;

                gap: 8px;
            }


            .logo img {

                width: 46px;
                height: 46px;
            }


            /* Hamburger */

            .hamburger-menu-icon {

                display: flex;
            }


            /* =====================================
               MOBILE SIDE MENU
            ===================================== */

            .sidenav {

                position: fixed !important;

                right: -280px;

                height: 100vh;

                background: #ffffff;

                overflow-y: auto;

                overflow-x: hidden;

                transition:

                   Menu overlay से ऊपर

                box-shadow:

            }


            .sidenav.active {

            /* Menu List */

            .sidenav > ul {

                padding:

            }

            .closebtn {

            /* =====================================

            .dropdown-menu {

            .dropdown-menu li a {

                font-size: 15px;

            }


            .dropdown-menu li a:active {

                background: #ffe7d8;

                color: #f4511e !important;
            }


            /* =====================================
               JOIN BUTTON
            ===================================== */

            .cta-button {

                display: block !important;

                width: 100%;

                text-align: center;

                margin-top: 12px;

                padding:
                    13px 10px !important;

                border-radius: 8px !important;
            }


            /* =====================================
               POSTER BUTTON
            ===================================== */

            .poster-link-button {

                display: block !important;

                width: 100%;

                text-align: center;

                background: #222222;

                color: #ffffff !important;

                padding:

                margin-top: 10px;

                border-radius: 8px;
            }


            /* =====================================
               HERO
            ===================================== */

            .hero-section {

                min-height: 500px;

                padding:
                    50px 0;
            }


            .hero-content {

                width: 90%;
            }


            .hero-content h1 {

                font-size: 36px;

                line-height: 1.4;
            }


            .hero-content h2 {

                font-size: 23px;
            }


            .hero-content p {

                font-size: 16px;

                line-height: 1.8;
            }


            .main-cta-button {

                font-size: 17px;

                padding:
                    14px 24px;
            }


            /* =====================================
               ABOUT
            ===================================== */

            .about-us-summary {

                padding: 60px 0;
            }


            .about-us-summary h2 {

                font-size: 36px;
            }


            .about-us-summary p {

                font-size: 16px;

                line-height: 1.9;
            }


            /* =====================================
               MISSION
            ===================================== */

            .mission-vision {

                padding: 55px 0;
            }


            .mission-grid {

                grid-template-columns: 1fr;

                gap: 20px;
            }


            .mission-item {

                padding: 32px 22px;
            }


            /* =====================================
               FOOTER
            ===================================== */

            .footer-grid {

                grid-template-columns: 1fr;

                gap: 30px;
            }


            .copyright {

                line-height: 1.7;
            }

        }


        /* =========================================
           MOBILE MENU OVERLAY
           
           IMPORTANT:
           Overlay की z-index menu से कम है
        ========================================= */

        .menu-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.45);

            /*
